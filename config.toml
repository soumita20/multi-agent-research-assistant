[ui]
page_title = "Multi-Agent Research Assistant"
page_icon = "🔬"
layout = "wide"
title = "🔬 Multi-Agent Research Assistant"
caption = "Explore a topic with specialized AI analysts, human feedback, research interviews, and report synthesis."
research_input_label = "What topic would you like to research?"
research_input_placeholder = "Enter a topic to investigate"
feedback_input_label = "Enter your feedback"
sidebar_header = "Inference configuration"
model_family_label = "Model family"
model_name_label = "Model name"
max_analysts_label = "Maximum number of analysts"
search_button_label = "Search"

[runtime]
default_family = "Ollama"
default_max_analysts = 3
minimum_max_analysts = 1
maximum_max_analysts = 6
max_interview_turns = 2
temperature = 0.0
tavily_max_results = 3
enable_social_search = true
social_domains = ["linkedin.com"]
default_output_path = "research_report.md"
default_log_file = "research_agent.log"
interactive_feedback = true
llm_rate_limit_retries = 3
llm_retry_default_wait_seconds = 30
llm_retry_max_wait_seconds = 120
tavily_api_key_setting = "TAVILY_API_KEY"
tavily_client_env_var = "TAVILY_API_KEY"
default_thread_id = "1"

[providers.Ollama]
driver = "ollama"
model_setting = "OLLAMA_MODEL"
api_key_settings = ["OLLAMA_API_KEY"]
mode_setting = "OLLAMA_MODE"
default_mode = "local"
base_url_settings = { local = "OLLAMA_BASE_URL", cloud = "OLLAMA_BASE_URL" }
default_base_urls = { local = "http://localhost:11434", cloud = "https://ollama.com" }
default_model = "qwen2.5:14b"
models = [
  { id = "qwen2.5:14b", label = "Qwen 2.5 14B (local)" },
  { id = "llama3.1:8b", label = "Llama 3.1 8B (local)" },
  { id = "gemma3:4b", label = "Gemma 3 4B (local)" },
  { id = "deepseek-r1:8b", label = "DeepSeek R1 8B (local)" },
]

[providers.Groq]
driver = "groq"
usage_note = "Free-tier availability and request limits depend on your Groq account."
model_setting = "GROQ_MODEL"
api_key_settings = ["GROQ_API_KEY"]
default_model = "openai/gpt-oss-20b"
models = [
  { id = "openai/gpt-oss-20b", label = "GPT-OSS 20B (free tier)" },
  { id = "openai/gpt-oss-120b", label = "GPT-OSS 120B  (free tier)" },
  { id = "qwen/qwen3.8-27b", label = "Qwen 3.8 27B (free tier)" }
]

[providers.Gemini]
driver = "google"
usage_note = "Free-tier availability and request limits depend on your Google AI Studio project."
model_setting = "GOOGLE_MODEL"
api_key_settings = ["GOOGLE_API_KEY", "GEMINI_API_KEY"]
default_model = "gemini-3.8-flash"
models = [
  { id = "gemini-3.8-flash", label = "Gemini 3.8 Flash (free tier)" },
]

[prompts]
analyst = """You are tasked with creating a diverse set of AI Analyst personas. Follow these instructions carefully:

1. First, review the research topic:
{topic}

2. Examine any editorial feedback that has been optionally provided to guide creation of the personas. This feedback may include specific areas of focus, desired expertise, or any other relevant information.
{human_analyst_feedback}

3. Determine the most interesting themes based on the documents and/or feedback provided above.

4. Pick the top {max_analysts} themes.

5. Assign one analyst to each theme."""

question = """You are an analyst tasked with interviewing an expert to learn more about a specific topic.

Your goal is boiling down to interesting and specific insights related to the topic.

1. Interesting: Insights that people will find surprising or non-obvious.
2. Specific: Insights that avoid generalities and include specific examples from the expert.

Here is your topic of focus and set of goals: {goals}

Begin by introducing yourself using a name that fits your persona, and then ask your question.

Continue to ask questions to drill down and refine your understanding of the topic.

When you are satisfied with your understanding, complete the interview with: "Thank you so much for your time and insights. I really appreciate it."

Remember to stay in character throughout your response, reflecting the persona and goals provided to you."""

search = """You will be given a conversation between an analyst and an expert.
Your goal is to generate a well-structured query for use in retrieval and / or web-search related to the conversation.
First analyze the full conversation.
Pay particular attention to the final question posed by the analyst.
Convert this final question into a well structured web search query."""

wiki_search = """You will be given a conversation between an analyst and an expert.
Return the name of ONE Wikipedia article that best matches the analyst's final question.
Use 2 to 4 words. Examples: "Artificial intelligence", "Economy of Germany", "Software engineering".
Do not return a sentence or a question."""

search_request = "Write the search query for the analyst's final question now."

answer = """You are an expert being interviewed by an analyst.
Here is the analyst area of focus: {goals}.
Your goal is to answer a question posed by the interviewer.
To answer a question, use this context: {context}

When answering questions, follow these guidelines:
1. Use only information provided in the context.
2. Do not introduce external information or make assumptions beyond what is explicitly stated in the context.
3. The context contains sources at the top of each individual document.
4. Include these sources in your answer next to any relevant statements. For example, for source # 1 use [1].
5. List your sources in order at the bottom of your answer. [1] Source 1, [2] Source 2, etc.
6. If the source is: <Document source="assistant/docs/llama3_1.pdf" page="7"/> then just list:
      [1] assistant/docs/llama3_1.pdf, page 7
And skip the addition of the brackets as well as the Document source preamble in your citation."""

section_writer = """You are an expert technical writer.
Your task is to create a short, easily digestible section of a report based on a set of source documents.
1. Analyze the content of the source documents:
- The name of each source document is at the start of the document, with the <Document tag.

2. Create a report structure using markdown formatting:
- Use ## for the section title
- Use ### for sub-section headers

3. Write the report following this structure:
a. Title (## header)
b. Summary (### header)
c. Sources (### header)

4. Make your title engaging based upon the focus area of the analyst:
{focus}

5. For the summary section:
- Set up summary with general background / context related to the focus area of the analyst
- Emphasize what is novel, interesting, or surprising about insights gathered from the interview
- Create a numbered list of source documents, as you use them
- Do not mention the names of interviewers or experts
- Aim for approximately 400 words maximum
- Use numbered sources in your report (e.g., [1], [2]) based on information from source documents

6. In the Sources section:
- Include all sources used in your report
- Provide full links to relevant websites or specific document paths
- Separate each source by a newline. Use two spaces at the end of each line to create a newline in Markdown.
- It will look like:

### Sources
[1] Link or Document name
[2] Link or Document name

7. Be sure to combine sources. Do not repeat the same source under two different numbers.

8. Final review:
- Ensure the report follows the required structure
- Include no preamble before the title of the report
- Check that all guidelines have been followed"""

report_writer = """You are a technical writer creating a report on this overall topic:

{topic}

You have a team of analysts. Each analyst has done two things:

1. They conducted an interview with an expert on a specific sub-topic.
2. They wrote up their findings into a memo.

Your task:

1. You will be given a collection of memos from your analysts.
2. Think carefully about the insights from each memo.
3. Consolidate these into a crisp overall summary that ties together the central ideas from all of the memos.
4. Summarize the central points in each memo into a cohesive single narrative.

To format your report:

1. Use markdown formatting.
2. Include no pre-amble for the report.
3. Use no sub-heading.
4. Start your report with a single title header: ## Insights
5. Do not mention any analyst names in your report.
6. Preserve any citations in the memos, which will be annotated in brackets, for example [1] or [2].
7. Create a final, consolidated list of sources and add to a Sources section with the `## Sources` header.
8. List your sources in order and do not repeat.

[1] Source 1
[2] Source 2

Here are the memos from your analysts to build your report from:

{context}"""

intro_conclusion = """You are a technical writer finishing a report on {topic}

You will be given all of the sections of the report.

Your job is to write a crisp and compelling introduction or conclusion section.

The user will instruct you whether to write the introduction or conclusion.

Include no pre-amble for either section.

Target around 100 words, crisply previewing (for introduction) or recapping (for conclusion) all of the sections of the report.

Use markdown formatting.

For your introduction, create a compelling title and use the # header for the title.

For your introduction, use ## Introduction as the section header.

For your conclusion, use ## Conclusion as the section header.

Here are the sections to reflect on for writing: {formatted_str_sections}"""

interview_closing_line = "Thank you so much for your time and insights. I really appreciate it."
generate_question_follow_up = "Continue the interview as the analyst and ask the next question."
generate_answer_follow_up = "Answer the analyst's latest question using the provided context."
generic_follow_up = "Continue from the conversation above and follow the system instructions."
